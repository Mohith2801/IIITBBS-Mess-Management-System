{% extends "base.html" %}{% block title %}Complaints{% endblock %}{% block content %}<div class="page-heading"><div class="eyebrow">WE'RE LISTENING</div><h1 class="section-title">Mess complaints</h1></div><div class="row g-4"><div class="col-lg-5"><div class="content-card"><form method="post"><label class="form-label">Subject</label><input class="form-control mb-3" name="subject" required><label class="form-label">Category</label><select class="form-select mb-3" name="category"><option>Food quality</option><option>Hygiene</option><option>Water</option><option>Service</option><option>Other</option></select><label class="form-label">Description</label><textarea class="form-control mb-3" rows="5" name="message" required></textarea><button class="btn btn-primary w-100">Submit complaint</button></form></div></div><div class="col-lg-7"><div class="content-card"><h5>My complaints</h5>{% for c in records %}<div class="history-item"><b>{{c.subject}} · {{c.status}}</b><p>{{c.message}}</p><small>{{c.created_at[:16]}}</small></div>{% else %}<p class="text-secondary">No complaints yet.</p>{% endfor %}</div></div></div>{% endblock %}
