{% extends "base.html" %}{% block title %}Reset Password{% endblock %}{% block content %}<div class="auth-shell"><div class="auth-card"><div class="eyebrow">VERIFY EMAIL OWNERSHIP</div><h1 class="section-title">Set a new password</h1><p class="text-secondary">OTP sent to <b>{{email}}</b>. It expires in five minutes and allows up to five attempts.</p><form method="post"><label class="form-label">Six-digit OTP</label><input class="form-control mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><label class="form-label">New password</label><input class="form-control mb-3" type="password" name="new_password" minlength="8" required><label class="form-label">Confirm new password</label><input class="form-control mb-4" type="password" name="confirm_password" minlength="8" required><button class="btn btn-primary w-100">Verify OTP & change password</button></form><p class="text-center mt-3 mb-0"><a href="{{url_for('forgot_password')}}">Request a new OTP</a></p></div></div>{% endblock %}
